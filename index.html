const CATS = {"cave": {"label": "Caves", "color": "#8B5E3C", "emoji": "🦇"}, "museum": {"label": "Museums", "color": "#6A4C93", "emoji": "🏛"}, "arcade": {"label": "Arcades", "color": "#E4572E", "emoji": "🕹"}, "watch": {"label": "Watches", "color": "#1F6F8B", "emoji": "⌚"}, "food": {"label": "Food", "color": "#C2185B", "emoji": "🍜"}, "farmers": {"label": "Markets", "color": "#2E9E4F", "emoji": "🌾"}, "park": {"label": "Outdoors", "color": "#2E7D32", "emoji": "🌳"}, "sight": {"label": "Sights", "color": "#1565C0", "emoji": "📍"}, "fun": {"label": "Fun", "color": "#F9A825", "emoji": "🎨"}, "travel": {"label": "Travel", "color": "#455A64", "emoji": "✈️"}};
const DAYLABEL = {"all": "All", "25": "Sat 25", "26": "Sun 26", "27": "Mon 27", "28": "Tue 28", "29": "Wed 29", "30": "Thu 30", "31": "Fri 31", "extras": "Extras"};

const map = L.map('map', {zoomControl:true, scrollWheelZoom:true}).setView([29.9,-98.3], 7);
setTimeout(() => map.invalidateSize(), 60);

const osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);
const topo = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17, subdomains: 'abc',
  attribution: 'Map data &copy; OpenStreetMap contributors, SRTM | Style &copy; <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
});
L.control.layers({'Streets': osm, 'Terrain': topo}, null, {position: 'topright', collapsed: true}).addTo(map);

let activeDay = 'all';
const offCats = new Set();
const markers = {};

function matches(p) {
  if (offCats.has(p.cat)) return false;
  if (activeDay === 'all') return true;
  if (activeDay === 'extras') return p.days.length === 0;
  return p.days.includes(activeDay);
}
function gmaps(p) {
  return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(p.lat + ',' + p.lon);
}

PLACES.forEach(p => {
  const c = CATS[p.cat] || {color:'#444', emoji:'•'};
  const icon = L.divIcon({
    className:'', iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-12],
    html: '<div class="pin" style="background:' + c.color + '">' + c.emoji + '</div>'
  });
  const m = L.marker([p.lat, p.lon], {icon}).addTo(map);
  const site = p.url ? '<a href="' + p.url + '" target="_blank" rel="noopener">Website</a>' : '';
  m.bindPopup('<div class="pop"><b>' + p.name + '</b>' +
    (p.note ? '<div class="n" style="color:#374151">' + p.note + '</div>' : '') +
    '<div class="n">' + p.addr + '</div>' +
    '<div style="margin-top:6px"><a href="' + gmaps(p) + '" target="_blank" rel="noopener">Directions</a>' + site + '</div></div>');
  markers[p.id] = m;
});

function renderPanel() {
  const vis = PLACES.filter(matches);
  const order = ['25','26','27','28','29','30','31','extras'];
  let h = '';
  order.forEach(d => {
    const items = vis.filter(p => d === 'extras' ? p.days.length === 0 : p.days.includes(d));
    if (!items.length) return;
    h += '<div class="dayhead">' + DAYLABEL[d] + (d === 'extras' ? ' · not scheduled' : '') + '</div>';
    items.forEach(p => {
      h += '<div class="row" data-id="' + p.id + '"><span class="e">' + CATS[p.cat].emoji + '</span>' +
           '<span><span class="nm">' + p.name + '</span><span class="sub"><br>' + (p.note || p.addr) + '</span></span></div>';
    });
  });
  document.getElementById('panel').innerHTML = h || '<div class="dayhead">nothing selected</div>';
  document.getElementById('count').textContent = vis.length + ' of ' + PLACES.length + ' pins';
  document.querySelectorAll('.row').forEach(r => r.onclick = () => {
    const p = PLACES.find(x => x.id === r.dataset.id);
    map.flyTo([p.lat, p.lon], 15, {duration: .7});
    setTimeout(() => markers[p.id].openPopup(), 760);
  });
}

function refresh() {
  PLACES.forEach(p => {
    if (matches(p)) markers[p.id].addTo(map);
    else map.removeLayer(markers[p.id]);
  });
  renderPanel();
}

document.querySelectorAll('.chip').forEach(b => b.onclick = () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  activeDay = b.dataset.day;
  refresh();
  const vis = PLACES.filter(matches);
  if (vis.length && activeDay !== 'all') {
    map.fitBounds(L.latLngBounds(vis.map(p => [p.lat, p.lon])).pad(.22), {maxZoom: 12});
  }
});

document.querySelectorAll('.leg').forEach(l => l.onclick = () => {
  const c = l.dataset.cat;
  if (offCats.has(c)) { offCats.delete(c); l.classList.remove('off'); }
  else { offCats.add(c); l.classList.add('off'); }
  refresh();
});

renderPanel();
map.fitBounds(L.latLngBounds(PLACES.map(p => [p.lat, p.lon])).pad(.06));
</script>
